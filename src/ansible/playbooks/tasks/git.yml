- name: Verify /config/gitconfig exists in controller
  stat:
    path: /config/gitconfig
  register: host_gitconfig
  delegate_to: localhost

- name: Abort if gitconfig is missing inside controller
  fail:
    msg: |
      /config/gitconfig not found inside the Ansible container.
      Ensure `~/.gitconfig:/config/gitconfig:ro` is mounted in docker-compose.yml.
  when: not host_gitconfig.stat.exists
  delegate_to: localhost

- name: Read gitconfig into memory (controller)
  slurp:
    src: /config/gitconfig
  register: gitconfig_b64
  delegate_to: localhost

- name: Write gitconfig on VM
  copy:
    content: "{{ gitconfig_b64.content | b64decode }}"
    dest: "/home/{{ ansible_user }}/.gitconfig"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Update package list and upgrade all packages
  apt:
    update_cache: yes
    upgrade: dist
    autoremove: yes
    autoclean: yes

- name: Install necessary packages
  apt:
    name:
      - git
      - git-lfs
    state: present

- name: Ensure .netrc file exists with correct permissions
  file:
    path: ~/.netrc
    state: touch
    mode: "0600"

- name: Ensure the repos directory exists
  file:
    path: "/home/{{ ansible_user }}/repos"
    state: directory
    mode: "0777"

- name: Set permissions for repos directory and all subdirectories
  file:
    path: "/home/{{ ansible_user }}/repos"
    mode: "0777"
    recurse: yes

- name: Ensure correct ownership of the repos directory
  file:
    path: "/home/{{ ansible_user }}/repos"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: yes

- name: Clone website repository
  git:
    repo: "{{ website_url }}"
    dest: "/home/{{ ansible_user }}/repos/website"
    force: yes

- name: Clone launcher repository
  git:
    repo: "{{ launcher_url }}"
    dest: "/home/{{ ansible_user }}/repos/launcher"
    force: yes

- name: Clone otclient repository
  git:
    repo: "{{ otclient_url }}"
    dest: "/home/{{ ansible_user }}/repos/otclient"
    force: yes

- name: Clone server repository
  git:
    repo: "{{ server_url }}"
    dest: "/home/{{ ansible_user }}/repos/server"
    force: yes

- name: Clone assets repository
  git:
    repo: "{{ assets_url }}"
    dest: "/home/{{ ansible_user }}/repos/assets"
    force: yes

- name: Initialize Git LFS
  command: git lfs install
  args:
    chdir: "/home/{{ ansible_user }}/repos/assets"

- name: Pull LFS files for assets repository
  command: git lfs pull
  args:
    chdir: "/home/{{ ansible_user }}/repos/assets"

- name: Set permissions for all repository directories
  file:
    path: "/home/{{ ansible_user }}/repos"
    mode: "0777"
    recurse: yes

- name: Ensure correct ownership of all repository directories
  file:
    path: "/home/{{ ansible_user }}/repos"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: yes

- name: Set Git to ignore permission changes
  command: git config core.fileMode false
  args:
    chdir: "/home/{{ ansible_user }}/repos/{{ item }}"
  with_items:
    - website
    - launcher
    - otclient
    - server
    - assets

- name: Set Git to avoid line ending conversions
  command: git config core.autocrlf input
  args:
    chdir: "/home/{{ ansible_user }}/repos/{{ item }}"
  with_items:
    - website
    - launcher
    - otclient
    - server
    - assets

- name: Reset any changes in the repositories
  command: git reset --hard HEAD
  args:
    chdir: "/home/{{ ansible_user }}/repos/{{ item }}"
  with_items:
    - website
    - launcher
    - otclient
    - server
    - assets

- name: Ensure ~/.netrc exists (0600)
  file:
    path: "/home/{{ ansible_user }}/.netrc"
    state: touch
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Check for ~/.gitconfig
  stat:
    path: "/home/{{ ansible_user }}/.gitconfig"
  register: gitconfig_stat

- name: Ensure ~/.gitconfig has correct owner/mode
  file:
    path: "/home/{{ ansible_user }}/.gitconfig"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  when: gitconfig_stat.stat.exists

- name: Ensure repos tree is writable by {{ ansible_user }}
  file:
    path: "/home/{{ ansible_user }}/repos"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0775"
    recurse: yes

- name: Reset executable bits and ignore permissions in Git
  shell: |
    git config --local core.fileMode false &&
    git config --local core.autocrlf input
  args:
    chdir: "/home/{{ ansible_user }}/repos/{{ item }}"
  loop:
    - website
    - launcher
    - otclient
    - server
    - assets
  become: true
  become_user: "{{ ansible_user }}"

- name: Set core.sshCommand to use the GitHub key (global)
  git_config:
    name: core.sshCommand
    scope: global
    value: "ssh -i ~/.ssh/github -o IdentitiesOnly=yes"
    state: present
  become: true
  become_user: "{{ ansible_user }}"
