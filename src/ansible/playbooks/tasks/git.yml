- name: Verify /config/gitconfig exists in controller
  stat:
    path: /config/gitconfig
  register: host_gitconfig
  delegate_to: localhost

- name: Abort if gitconfig is missing inside controller
  fail:
    msg: |
      /config/gitconfig not found inside the Ansible container.
      Ensure `~/.gitconfig:/config/gitconfig:ro` is mounted in docker-compose.yml.
  when: not host_gitconfig.stat.exists
  delegate_to: localhost

- name: Read gitconfig into memory (controller)
  slurp:
    src: /config/gitconfig
  register: gitconfig_b64
  delegate_to: localhost

- name: Write gitconfig on VM
  copy:
    content: "{{ gitconfig_b64.content | b64decode }}"
    dest: "/home/{{ ansible_user }}/.gitconfig"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Update package list and upgrade all packages
  apt:
    update_cache: yes
    upgrade: dist
    autoremove: yes
    autoclean: yes

- name: Install necessary packages
  apt:
    name:
      - git
      - git-lfs
    state: present

- name: Ensure .netrc file exists with correct permissions
  file:
    path: ~/.netrc
    state: touch
    mode: "0600"

- name: Ensure the repos directory exists
  file:
    path: "/home/{{ ansible_user }}/repositories"
    state: directory
    mode: "0777"

- name: Set permissions for repos directory and all subdirectories
  file:
    path: "/home/{{ ansible_user }}/repositories"
    mode: "0777"

- name: Ensure correct ownership of the repos directory
  file:
    path: "/home/{{ ansible_user }}/repositories"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Ensure ~/.netrc exists (0600)
  file:
    path: "/home/{{ ansible_user }}/.netrc"
    state: touch
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Check for ~/.gitconfig
  stat:
    path: "/home/{{ ansible_user }}/.gitconfig"
  register: gitconfig_stat

- name: Ensure ~/.gitconfig has correct owner/mode
  file:
    path: "/home/{{ ansible_user }}/.gitconfig"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  when: gitconfig_stat.stat.exists

- name: Ensure repos tree is writable by {{ ansible_user }}
  file:
    path: "/home/{{ ansible_user }}/repositories"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0775"

- name: Set core.sshCommand to use the GitHub key (global)
  git_config:
    name: core.sshCommand
    scope: global
    value: "ssh -i ~/.ssh/github -o IdentitiesOnly=yes"
    state: present
  become: true
  become_user: "{{ ansible_user }}"

- name: Ensure SSH directory exists
  file:
    path: "/home/{{ ansible_user }}/.ssh"
    state: directory
    mode: "0700"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true

- name: Configure SSH to use github key for github.com
  blockinfile:
    path: "/home/{{ ansible_user }}/.ssh/config"
    create: yes
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR GITHUB"
    block: |
      Host github.com
        HostName github.com
        User git
        IdentityFile ~/.ssh/github
        IdentitiesOnly yes
        StrictHostKeyChecking no
  become: true
  become_user: "{{ ansible_user }}"

- name: Copy github SSH key from controller to VM (if needed)
  copy:
    src: "{{ item }}"
    dest: "/home/{{ ansible_user }}/.ssh/{{ item | basename }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "{{ '0600' if 'pub' not in item else '0644' }}"
  with_fileglob:
    - "~/.ssh/github*"
  become: true
  ignore_errors: true

- name: Ensure proper permissions on SSH key
  file:
    path: "/home/{{ ansible_user }}/.ssh/github"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true

- name: Remove any existing GitHub entries from known_hosts
  lineinfile:
    path: "/home/{{ ansible_user }}/.ssh/known_hosts"
    regexp: '^github\.com'
    state: absent
  become: true
  become_user: "{{ ansible_user }}"

- name: Add GitHub to known_hosts
  shell: |
    ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts
  become: true
  become_user: "{{ ansible_user }}"
  changed_when: true

- name: Ensure proper permissions on known_hosts
  file:
    path: "/home/{{ ansible_user }}/.ssh/known_hosts"
    mode: "0644"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true

- name: Clone all repositories
  git:
    repo: "{{ item.url }}"
    dest: "/home/{{ ansible_user }}/repositories/{{ item.name }}"
    force: yes
    accept_hostkey: yes
  environment:
    GIT_SSH_COMMAND: "ssh -i ~/.ssh/github -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
  become: true
  become_user: "{{ ansible_user }}"
  loop:
    - { name: "infrastructure", url: "{{ infrastructure_url }}" }
    - { name: "launcher", url: "{{ launcher_url }}" }
    - { name: "website", url: "{{ website_url }}" }
    - { name: "client", url: "{{ client_url }}" }
    - { name: "server", url: "{{ server_url }}" }
    - { name: "wiki", url: "{{ wiki_url }}" }
  loop_control:
    label: "{{ item.name }}"

- name: Set permissions for all repository directories
  file:
    path: "/home/{{ ansible_user }}/repositories"
    mode: "0777"

- name: Ensure correct ownership of all repository directories
  file:
    path: "/home/{{ ansible_user }}/repositories"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Set Git to ignore permission changes
  command: git config core.fileMode false
  args:
    chdir: "/home/{{ ansible_user }}/repositories/{{ item }}"
  with_items:
    - website
    - launcher
    - client
    - server
    - wiki
    - infrastructure

- name: Set Git to avoid line ending conversions
  command: git config core.autocrlf input
  args:
    chdir: "/home/{{ ansible_user }}/repositories/{{ item }}"
  with_items:
    - website
    - launcher
    - client
    - server
    - wiki
    - infrastructure

- name: Reset any changes in the repositories
  command: git reset --hard HEAD
  args:
    chdir: "/home/{{ ansible_user }}/repositories/{{ item }}"
  with_items:
    - website
    - launcher
    - client
    - server
    - wiki
    - infrastructure

