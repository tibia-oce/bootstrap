- name: Create a desktop shortcut to the repos folder
  file:
    src: "/home/{{ ansible_user }}/repos"
    dest: "/home/{{ ansible_user }}/Desktop/repos"
    state: link

- name: Create a desktop shortcut to the tools folder
  file:
    src: "/home/{{ ansible_user }}/tools"
    dest: "/home/{{ ansible_user }}/Desktop/tools"
    state: link

- name: Create a desktop shortcut for VSCode
  template:
    src: vscode/vscode.desktop.j2
    dest: "/home/{{ ansible_user }}/Desktop/vscode.desktop"
    mode: "0755"

- name: Create a desktop shortcut for Terminal
  template:
    src: terminal/terminal.desktop.j2
    dest: "/home/{{ ansible_user }}/Desktop/terminal.desktop"
    mode: "0755"

- name: Create a desktop shortcut for the client
  template:
    src: client/client.j2
    dest: "/home/{{ ansible_user }}/Desktop/client.desktop"
    mode: "0755"

- name: Ensure the .desktop file is executable
  file:
    path: /home/{{ ansible_user }}/Desktop/client.desktop
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
